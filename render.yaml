services:
  # 1. Python FastAPI AI Service (ChromaDB + Gemini RAG)
  - type: web
    name: intraai-ai-service
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  # 2. Node.js Express Backend API
  - type: web
    name: intraai-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: intraai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: intraai-redis
          property: connectionString
      - key: AI_SERVICE_URL
        sync: false  # Set to https://intraai-ai-service.onrender.com after deploy
      - key: JWT_SECRET
        generateValue: true

  # 3. Node.js BullMQ Document Processing Worker
  - type: worker
    name: intraai-worker
    env: node
    rootDir: worker
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intraai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: intraai-redis
          property: connectionString
      - key: AI_SERVICE_URL
        sync: false  # Set to https://intraai-ai-service.onrender.com after deploy

# Databases & Caching Infrastructure
databases:
  - name: intraai-postgres
    databaseName: intraai_db
    user: admin

# Redis Instance
# (Can also be added manually as a Render Redis instance or Upstash Redis)
